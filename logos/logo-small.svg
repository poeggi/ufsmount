<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>ufsmount</title>
  <!-- tail with arrow head, behind the drive -->
  <path d="M24 27 Q30.5 25 29 16.5" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <polygon points="25.6,18 29.2,10.5 32,18.2" fill="#c0392b"/>
  <!-- horns -->
  <polygon points="7.2,9.5 5.6,1.2 12,6.4" fill="#c0392b"/>
  <polygon points="20.8,9.5 22.4,1.2 16,6.4" fill="#c0392b"/>
  <!-- head -->
  <circle cx="14" cy="11.5" r="7.2" fill="#c0392b"/>
  <!-- eyes -->
  <ellipse cx="11.4" cy="10.4" rx="2.1" ry="2.5" fill="#ffffff"/>
  <ellipse cx="16.6" cy="10.4" rx="2.1" ry="2.5" fill="#ffffff"/>
  <circle cx="11.9" cy="10.9" r="1.1" fill="#111827"/>
  <circle cx="17.1" cy="10.9" r="1.1" fill="#111827"/>
  <!-- drive: white with a dark outline -->
  <rect x="2.5" y="16" width="23" height="13.5" rx="2.5" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <!-- hands on the edge -->
  <circle cx="7.5" cy="16" r="2.2" fill="#c0392b"/>
  <circle cx="20.5" cy="16" r="2.2" fill="#c0392b"/>
  <!-- "U:" as shapes -->
  <path d="M7.2 19.5 V23.6 Q7.2 26.4 10 26.4 Q12.8 26.4 12.8 23.6 V19.5" stroke="#111827" stroke-width="2.3" fill="none"/>
  <rect x="15" y="20" width="2.2" height="2.2" fill="#111827"/>
  <rect x="15" y="24.2" width="2.2" height="2.2" fill="#111827"/>
  <!-- activity light -->
  <circle cx="22" cy="25.2" r="1.5" fill="#16a34a"/>
</svg>
