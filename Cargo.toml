[workspace]
members = ["crates/winfsp-mount", "products/ufsmount"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/poeggi/winfsp-ufs"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.5"
env_logger = "0.11.11"
log = "0.4.35"
thiserror = "2.0.21"
windows = "0.62.2"
winfsp = { version = "0.13.2", default-features = false, features = ["windows-62"] }
winresource = "0.1.34"
zstd = "0.14.4"

[profile.release]
lto = "thin"
