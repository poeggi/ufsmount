[package]
name = "ufsmount"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
description = "Mount FreeBSD UFS2 disks read-only on Windows, using WinFsp"
repository = "https://github.com/poeggi/winfsp-ufs"
publish = false

[workspace]
exclude = ["vendor"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.5"
env_logger = "0.11.11"
log = "0.4.35"
rufs = { path = "vendor/fuse-ufs/rufs" }
thiserror = "2.0.21"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Console"] }
winfsp = { version = "0.13.2", default-features = false }

[profile.release]
lto = "thin"

[dev-dependencies]
zstd = "0.14.4"
